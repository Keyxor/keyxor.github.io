baseURL: "https://keyxor.github.io/"
locale: "en-us"
title: "Keyxor"
theme: "PaperMod"

# TEMPORARY: site is unfinished. Emits <meta name="robots" content="noindex,
# nofollow"> on every page. Remove this block (and layouts/robots.txt) to
# allow indexing.
cascade:
  - target: {}
    robotsNoIndex: true

    # Publish only the image variants the render hook processes (resized and
    # re-encoded, so EXIF never reaches the site). Without this, Hugo copies
    # every file in a page bundle to public/ - full-resolution originals and
    # any stray screenshot that is not referenced by the post.
    build:
      publishResources: false

enableRobotsTXT: true
enableGitInfo: true      # lastmod from Git; workflow uses fetch-depth: 0
pygmentsUseClasses: true # Chroma via CSS classes (PaperMod styles these)

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Keyxor"

  # Required: without this the home page lists only the largest section
  # Sections are content types. Offensive vs defensive is a category, not a
  # section, so a writeup that is honestly both does not have to pick one.
  mainSections:
    - writeups
    - tools
    # - projects  # uncomment for larger builds (cloud lab, Terraform, etc.)
    # - articles  # uncomment when the first article exists

  # Use Hugo/Chroma only; disable PaperMod's client-side highlight.js
  assets:
    disableHLJS: true
  description: "Cybersecurity research, offensive security, detection engineering, and threat hunting."
  author: "Keyxor"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  socialIcons:
    - name: github
      url: "https://github.com/Keyxor"

    - name: linkedin
      url: "https://www.linkedin.com/in/noah-cuberly"

menu:
  main:
    - identifier: writeups
      name: Writeups
      url: /writeups/
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      weight: 30

    # Uncomment for larger builds that span more than a single tool
    # - identifier: projects
    #   name: Projects
    #   url: /projects/
    #   weight: 40

    # Uncomment when the first article exists
    # - identifier: articles
    #   name: Articles
    #   url: /articles/
    #   weight: 50

    - identifier: search
      name: Search
      url: /search/
      weight: 60

    - identifier: github
      name: "GitHub ↗"
      url: "https://github.com/Keyxor"
      weight: 70

taxonomies:
  category: categories
  tag: tags

markup:
  highlight:
    codeFences: true
    noClasses: false   # pairs with pygmentsUseClasses
    guessSyntax: false # guessing mangles nmap/Burp/tool output; tag fences explicitly
    lineNos: false     # enable per block with {linenos=true} when it helps
