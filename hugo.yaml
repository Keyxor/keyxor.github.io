baseURL: "https://keyxor.github.io/"
locale: "en-us"
title: "Keyxor"
theme: "PaperMod"

# TEMPORARY: site is unfinished. Emits <meta name="robots" content="noindex,
# nofollow"> on every page. Remove this block (and layouts/robots.txt) to
# allow indexing.
cascade:
  - target: {}
    robotsNoIndex: true

    # Publish only the image variants the render hook processes (resized and
    # re-encoded, so EXIF never reaches the site). Without this, Hugo copies
    # every file in a page bundle to public/ - full-resolution originals and
    # any stray screenshot that is not referenced by the post.
    build:
      publishResources: false

enableRobotsTXT: true
enableGitInfo: true      # lastmod from Git; workflow uses fetch-depth: 0
pygmentsUseClasses: true # Chroma via CSS classes (PaperMod styles these)

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Keyxor"

  # Required: without this the home page lists only the largest section
  # Sections are content types. Offensive vs defensive is a category, not a
  # section, so a writeup that is honestly both does not have to pick one.
  mainSections:
    - work
    - tools
    # - projects  # uncomment for larger builds (cloud lab, Terraform, etc.)
    # - articles  # uncomment when the first article exists

  # Use Hugo/Chroma only; disable PaperMod's client-side highlight.js
  assets:
    disableHLJS: true

    # Favicon set lives in static/ and is copied to the site root verbatim.
    # PaperMod emits <link> tags for favicon.ico, the two PNGs, and
    # apple-touch-icon.png from these params, falling back to the same
    # filenames if unset - they are named here so the set is documented in one
    # place. safari_pinned_tab has no theme default that exists on disk, so
    # leaving it unset means a 404 on every page load.
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#0b1020"
    msapplication_TileColor: "#0b1020"
  description: "Cybersecurity research, offensive security, detection engineering, and threat hunting."
  author: "Keyxor"

  # Dark only. baseof.html stamps data-theme="dark" server-side and, with the
  # toggle disabled, footer.html emits no theme JS - so the palette in
  # assets/css/extended/custom.css is the only one that ever renders.
  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  socialIcons:
    - name: github
      url: "https://github.com/Keyxor"

    - name: linkedin
      url: "https://www.linkedin.com/in/noah-cuberly"

    - name: hackthebox
      url: "https://profile.hackthebox.com/profile/019e4237-2502-73b4-a8bf-15bea8e6ac14"

menu:
  main:
    - identifier: work
      name: Work
      url: /work/
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      weight: 30

    # Uncomment for larger builds that span more than a single tool
    # - identifier: projects
    #   name: Projects
    #   url: /projects/
    #   weight: 40

    # Uncomment when the first article exists
    # - identifier: articles
    #   name: Articles
    #   url: /articles/
    #   weight: 50

    - identifier: search
      name: Search
      url: /search/
      weight: 60

    - identifier: github
      name: "GitHub ↗"
      url: "https://github.com/Keyxor"
      weight: 70

taxonomies:
  category: categories
  tag: tags

markup:
  highlight:
    codeFences: true
    noClasses: false   # pairs with pygmentsUseClasses
    guessSyntax: false # guessing mangles nmap/Burp/tool output; tag fences explicitly
    lineNos: false     # enable per block with {linenos=true} when it helps
